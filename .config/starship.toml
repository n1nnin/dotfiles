# Powerline-style Starship config
# Requires Nerd Font (Hack Nerd Font)

format = """
[](fg:#5c6370)\
[$directory](bg:#5c6370 fg:#ffffff)\
[](fg:#5c6370 bg:#9b59b6)\
$git_branch\
$git_status\
[](fg:#9b59b6 bg:#3e4451)\
$python\
$nodejs\
$golang\
$ruby\
[](fg:#3e4451)\
$character"""

right_format = """$memory_usage$battery$time"""

# ディレクトリ
[directory]
style = "bg:#5c6370 fg:#ffffff"
format = "[ $path ]($style)"
truncation_length = 4
truncation_symbol = "…/"

# Git ブランチ
[git_branch]
symbol = " "
style = "bg:#9b59b6 fg:#ffffff"
format = "[ $symbol$branch ]($style)"

# Git ステータス
[git_status]
style = "bg:#9b59b6 fg:#ffcb6b"
format = "[$all_status$ahead_behind]($style)"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
staged = "+${count}"
untracked = "?${count}"
deleted = "✘${count}"

# 言語バージョン表示
[python]
symbol = " "
style = "bg:#3e4451 fg:#ffcb6b"
format = "[ $symbol$version ]($style)"

[nodejs]
symbol = " "
style = "bg:#3e4451 fg:#c3e88d"
format = "[ $symbol$version ]($style)"

[golang]
symbol = " "
style = "bg:#3e4451 fg:#89ddff"
format = "[ $symbol$version ]($style)"

[ruby]
symbol = " "
style = "bg:#3e4451 fg:#f07178"
format = "[ $symbol$version ]($style)"

# プロンプト文字
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# コマンド実行時間
[cmd_duration]
min_time = 2_000
format = "[ took $duration](fg:#888888) "

# 時刻（右側）
[time]
disabled = false
style = "fg:#888888"
format = "[$time]($style)"
time_format = "%H:%M"

# バッテリー（常時表示）
[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "🔋"
format = "[$symbol$percentage]($style) "

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "yellow"

[[battery.display]]
threshold = 100
style = "fg:#888888"

# メモリ使用量（右側、75%以上で表示）
[memory_usage]
disabled = false
threshold = -1
symbol = "󰍛 "
style = "fg:#888888"
format = "[$symbol$ram_pct]($style) "

# 不要なモジュールを非表示
[package]
disabled = true
